spring:
  application:
    name: ms-eureka-naming-server
  output:
    ansi:
      enabled: ALWAYS
#  sleuth:
#    enabled: false
  zipkin:
    enabled: false
    #base-url: ${ZIPKIN_SERVER:http://localhost:9411/}

server:
  port: ${port:8777}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false


