spring:
  application:
    name: ms-product-enquiry-service
  output:
    ansi:
      enabled: ALWAYS
  sleuth:
      enabled: false
#  zipkin:
#      enabled: true
#      base-url: ${ZIPKIN_SERVER:http://localhost:9411/}

server:
  port: ${port:8700}

eureka:
  client:
    enabled: true
    serviceUrl:
      defaultZone: ${EUREKA_SERVER:http://localhost:8777/eureka}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always


